services:
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: task-manager-api
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - WEB_ORIGIN=http://localhost:3001
    restart: unless-stopped

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:3000
    container_name: task-manager-web
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
      - NEXT_PUBLIC_API_URL=http://localhost:3000
    depends_on:
      - api
    restart: unless-stopped

